repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix, --config=backend/pyproject.toml]
      - id: ruff-format
        args: [--config=backend/pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings
          - sqlalchemy[asyncio]
          - fastapi

  - repo: local
    hooks:
      - id: arch-and-secrets-guard
        name: Hexagonal Architecture & Hardcoded Secrets Guard
        entry: python scripts/arch_and_secrets_guard.py
        language: system
        pass_filenames: false
        always_run: true
