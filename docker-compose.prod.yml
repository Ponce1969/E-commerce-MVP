# ==============================================================================
# 2 Rodríguez Distribuidora — Producción Docker Compose (Orange Pi / Ubuntu Linux)
# ==============================================================================

services:
  # Base de Datos PostgreSQL aislada
  postgres:
    image: postgres:16-alpine
    container_name: web_2r_postgres
    ports:
      # Solo desde el propio host: lo usa el daemon de monitoreo (Guardian)
      # para el health probe y los backups. No se expone a la red.
      - "127.0.0.1:5446:5432"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 8s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - web2r_internal

  # Backend FastAPI con uv y Alembic (ISO 27001 Hardened)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web_2r_backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
    volumes:
      - web2r_uploads:/app/uploads
      - ./backend/data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    networks:
      - web2r_internal

  # Frontend Astro 5 servido por Nginx de alto rendimiento
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web_2r_frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "4322:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - web2r_internal

# Red interna segura y volúmenes persistentes
networks:
  web2r_internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  web2r_uploads:
    driver: local
